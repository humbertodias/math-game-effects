name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.6
          actions-cache-folder: emsdk-cache-6.0.6

      - name: Cache Emscripten ports
        uses: actions/cache@v6
        with:
          path: ${{ env.EMSDK }}/upstream/emscripten/cache
          key: emscripten-sdl3-${{ runner.os }}-6.0.6
          restore-keys: emscripten-sdl3-${{ runner.os }}-

      - name: Show toolchain
        run: emcc -v

      - name: Compile demos to WebAssembly
        run: python3 web/build.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
